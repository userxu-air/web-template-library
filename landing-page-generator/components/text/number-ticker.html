<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数字滚动计数</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}

.ticker{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(3rem,10vw,8rem);
  background:linear-gradient(180deg,#fff,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent;}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body class="bg-neutral-950 text-white min-h-screen flex items-center justify-center p-8">
<div class="text-center">
  <div class="flex items-end justify-center gap-6 md:gap-12">
    <div><div class="ticker" data-target="1200">0</div><div class="text-neutral-400 mt-2">用户</div></div>
    <div><div class="ticker" data-target="98">0</div><div class="text-neutral-400 mt-2">好评率%</div></div>
    <div><div class="ticker" data-target="50">0</div><div class="text-neutral-400 mt-2">合作品牌</div></div>
  </div>
</div>
<script>
function animate(el){const target=+el.dataset.target;const dur=1800;const start=performance.now();
function step(t){const p=Math.min((t-start)/dur,1);const eased=1-Math.pow(1-p,3);
  el.textContent=Math.round(target*eased);if(p<1)requestAnimationFrame(step);}
requestAnimationFrame(step);}
const io=new IntersectionObserver((es)=>{es.forEach(e=>{if(e.isIntersecting){animate(e.target);io.unobserve(e.target);}})},{threshold:.5});
document.querySelectorAll('.ticker').forEach(el=>io.observe(el));
</script>
</body>
</html>

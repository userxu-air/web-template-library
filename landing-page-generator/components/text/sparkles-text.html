<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星光闪烁文字</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}

.sparkle{position:relative;display:inline-block;font-family:'Space Grotesk',sans-serif;}
.sparkle::before,.sparkle::after{content:'';position:absolute;width:6px;height:6px;border-radius:50%;
  background:#fff;box-shadow:0 0 10px #fff,0 0 20px #a78bfa;animation:twinkle 2s ease-in-out infinite;}
.sparkle::before{top:-8px;left:-6px;animation-delay:0s;}
.sparkle::after{bottom:-6px;right:-4px;animation-delay:1s;}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1.2)}}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body class="bg-neutral-950 text-white min-h-screen flex items-center justify-center p-8">
<div class="text-center">
  <h1 class="text-6xl md:text-8xl font-extrabold tracking-tight">让创意 <span class="sparkle text-violet-400">闪耀</span></h1>
  <p class="mt-6 text-neutral-400 text-lg">带有星光闪烁特效的强调文字，聚焦用户视线。</p>
</div>
<script></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>流光边框</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}

.shine{position:relative;border-radius:16px;overflow:hidden;padding:32px;background:#171717;}
.shine::before{content:'';position:absolute;inset:0;padding:2px;border-radius:16px;
  background:linear-gradient(120deg,transparent 30%,#a78bfa 50%,transparent 70%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  animation:borderflow 3s linear infinite;background-size:300% 100%;}
@keyframes borderflow{0%{background-position:0% 0}100%{background-position:300% 0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body class="bg-neutral-950 text-white min-h-screen flex items-center justify-center p-8">
<div class="shine max-w-md">
  <h3 class="text-xl font-bold mb-2">流光边框</h3>
  <p class="text-neutral-400 text-sm">一道光沿着边框循环流动，低调却吸睛。</p>
</div>
<script></script>
</body>
</html>

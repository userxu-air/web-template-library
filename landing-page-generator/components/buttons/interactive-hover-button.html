<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>磁吸交互按钮</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}

.magnet{position:relative;padding:16px 40px;border-radius:999px;font-weight:700;border:none;cursor:pointer;
  background:#0f172a;color:#fff;border:1px solid #334155;transition:box-shadow .3s;will-change:transform;}
.magnet:hover{box-shadow:0 10px 30px rgba(167,139,250,.4);}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body class="bg-neutral-950 text-white min-h-screen flex flex-wrap items-center justify-center gap-6 p-8">
<button class="magnet" data-strength="0.3">磁吸按钮</button>
<button class="magnet" data-strength="0.5" style="background:#a78bfa;color:#0a0a0a;border:none">强磁吸</button>
<script>
document.querySelectorAll('.magnet').forEach(btn=>{
  const strength=+btn.dataset.strength;
  btn.addEventListener('mousemove',e=>{
    const r=btn.getBoundingClientRect();
    const x=(e.clientX-r.left-r.width/2)*strength;
    const y=(e.clientY-r.top-r.height/2)*strength;
    btn.style.transform=`translate(${x}px,${y}px)`;
  });
  btn.addEventListener('mouseleave',()=>{btn.style.transform='translate(0,0)';});
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bento 网格布局</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}

.bento{display:grid;gap:16px;grid-template-columns:repeat(4,1fr);grid-auto-rows:120px;}
.bento > div{border-radius:16px;padding:20px;background:#171717;border:1px solid #262626;
  transition:transform .3s,border-color .3s;display:flex;flex-direction:column;justify-content:flex-end;}
.bento > div:hover{transform:scale(1.02);border-color:#a78bfa;}
.b{grid-column:span 2;grid-row:span 2;}
.c{grid-column:span 2;}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body class="bg-neutral-950 text-white min-h-screen flex items-center justify-center p-8">
<div class="bento w-full max-w-3xl">
  <div class="b" style="background:linear-gradient(135deg,#a78bfa,#f472b6)"><h3 class="font-bold">主功能</h3></div>
  <div class="c"><h4 class="font-bold text-sm">指标 A</h4></div>
  <div class="c"><h4 class="font-bold text-sm">指标 B</h4></div>
  <div><h4 class="font-bold text-sm">小</h4></div>
  <div><h4 class="font-bold text-sm">小</h4></div>
  <div class="c"><h4 class="font-bold text-sm">宽</h4></div>
</div>
<script></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>边框光束环绕</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}

.beam-wrap{position:relative;border-radius:16px;overflow:hidden;padding:32px;background:#171717;border:1px solid #262626;}
.beam{position:absolute;inset:-2px;border-radius:16px;pointer-events:none;overflow:hidden;}
.beam::before{content:'';position:absolute;top:50%;left:50%;width:60%;height:200%;
  background:linear-gradient(180deg,transparent,#a78bfa,transparent);
  animation:spin 3s linear infinite;transform-origin:center;}
@keyframes spin{0%{transform:translate(-50%,-50%) rotate(0deg)}100%{transform:translate(-50%,-50%) rotate(360deg)}}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body class="bg-neutral-950 text-white min-h-screen flex items-center justify-center p-8">
<div class="beam-wrap relative max-w-md">
  <div class="beam"></div>
  <h3 class="text-xl font-bold mb-2 relative">边框光束</h3>
  <p class="text-neutral-400 text-sm relative">一束光环绕卡片旋转，营造科技感。</p>
</div>
<script></script>
</body>
</html>

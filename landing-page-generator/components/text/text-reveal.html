<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>逐行揭示文字</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}

.line{overflow:hidden;display:block;}
.line span{display:block;transform:translateY(110%);transition:transform .8s cubic-bezier(.16,1,.3,1);}
.line.is-visible span{transform:translateY(0);}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body class="bg-neutral-950 text-white min-h-screen flex items-center justify-center p-8">
<div class="text-center text-5xl md:text-7xl font-extrabold tracking-tight leading-tight">
  <span class="line"><span>优雅的</span></span>
  <span class="line"><span>逐行揭示</span></span>
  <span class="line"><span>入场动画</span></span>
</div>
<script>
const io=new IntersectionObserver((es)=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('is-visible');io.unobserve(e.target);}})},{threshold:.5});
document.querySelectorAll('.line').forEach((el,i)=>{el.style.transitionDelay=(i*0.12)+'s';el.querySelector('span').style.transitionDelay=(i*0.12)+'s';io.observe(el);});
</script>
</body>
</html>

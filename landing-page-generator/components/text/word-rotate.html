<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>词语轮播切换</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}

.rotator{display:inline-block;vertical-align:top;height:1.2em;overflow:hidden;}
.rotator ul{list-style:none;margin:0;padding:0;animation:rotate 6s infinite;}
.rotator li{font-weight:800;background:linear-gradient(90deg,#f472b6,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent;}
@keyframes rotate{0%,20%{transform:translateY(0)}25%,45%{transform:translateY(-1.2em)}50%,70%{transform:translateY(-2.4em)}75%,95%{transform:translateY(-3.6em)}100%{transform:translateY(-4.8em)}}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body class="bg-neutral-950 text-white min-h-screen flex items-center justify-center p-8">
<div class="text-center">
  <h1 class="text-5xl md:text-7xl font-extrabold tracking-tight leading-tight">我们让<br>
  <span class="rotator"><ul>
    <li>创意</li><li>品牌</li><li>增长</li><li>体验</li><li>创意</li>
  </ul></span><br>脱颖而出</h1>
</div>
<script></script>
</body>
</html>

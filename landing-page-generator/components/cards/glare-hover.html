<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>眩光悬停</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}

.glare{position:relative;overflow:hidden;border-radius:16px;padding:32px;background:#171717;cursor:pointer;}
.glare::after{content:'';position:absolute;top:-50%;left:-60%;width:50%;height:200%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);
  transform:rotate(20deg);transition:left .6s ease;}
.glare:hover::after{left:120%;}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body class="bg-neutral-950 text-white min-h-screen flex items-center justify-center p-8">
<div class="glare max-w-md">
  <h3 class="text-xl font-bold mb-2">眩光扫过</h3>
  <p class="text-neutral-400 text-sm">悬停时一道高光斜向扫过卡片表面。</p>
</div>
<script></script>
</body>
</html>

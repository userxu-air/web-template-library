<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>环绕轨道</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}

.orbit{position:relative;width:320px;height:320px;}
.center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:100px;height:100px;border-radius:50%;
  background:linear-gradient(135deg,#a78bfa,#f472b6);display:flex;align-items:center;justify-content:center;font-weight:800;}
.ring{position:absolute;top:50%;left:50%;border:1px dashed #333;border-radius:50%;}
.ring1{width:200px;height:200px;transform:translate(-50%,-50%);}
.ring2{width:300px;height:300px;transform:translate(-50%,-50%);}
.sat{position:absolute;top:50%;left:50%;width:24px;height:24px;border-radius:50%;}
.sat1{background:#34d399;animation:orbit1 4s linear infinite;}
.sat2{background:#60a5fa;animation:orbit2 6s linear infinite;}
@keyframes orbit1{from{transform:rotate(0) translateX(100px) rotate(0)}to{transform:rotate(360deg) translateX(100px) rotate(-360deg)}}
@keyframes orbit2{from{transform:rotate(0) translateX(150px) rotate(0)}to{transform:rotate(-360deg) translateX(150px) rotate(360deg)}}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body class="bg-neutral-950 text-white min-h-screen flex items-center justify-center p-8">
<div class="orbit">
  <div class="ring ring1"></div><div class="ring ring2"></div>
  <div class="sat sat1"></div><div class="sat sat2"></div>
  <div class="center">核心</div>
</div>
<script></script>
</body>
</html>

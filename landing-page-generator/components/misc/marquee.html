<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>跑马灯</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}

.marquee{overflow:hidden;width:100%;}
.marquee-track{display:flex;gap:48px;width:max-content;animation:scroll 20s linear infinite;}
.marquee:hover .marquee-track{animation-play-state:paused;}
.marquee-item{font-size:32px;font-weight:800;color:#525252;white-space:nowrap;transition:color .3s;}
.marquee-item:hover{color:#fff;}
@keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body class="bg-neutral-950 text-white min-h-screen flex items-center justify-center p-8">
<div class="marquee max-w-3xl">
  <div class="marquee-track">
    <span class="marquee-item">品牌 A</span><span class="marquee-item">品牌 B</span><span class="marquee-item">品牌 C</span>
    <span class="marquee-item">品牌 D</span><span class="marquee-item">品牌 E</span><span class="marquee-item">品牌 F</span>
    <span class="marquee-item">品牌 A</span><span class="marquee-item">品牌 B</span><span class="marquee-item">品牌 C</span>
    <span class="marquee-item">品牌 D</span><span class="marquee-item">品牌 E</span><span class="marquee-item">品牌 F</span>
  </div>
</div>
<script></script>
</body>
</html>

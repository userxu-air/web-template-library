<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>霓虹渐变卡片</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}

.neon{border-radius:20px;padding:32px;background:linear-gradient(135deg,#1a1a2e,#16213e);
  box-shadow:0 0 30px rgba(167,139,250,.4),0 0 60px rgba(244,114,182,.2);
  border:1px solid rgba(167,139,250,.3);transition:all .4s ease;}
.neon:hover{box-shadow:0 0 50px rgba(167,139,250,.7),0 0 100px rgba(244,114,182,.4);
  transform:translateY(-6px);}
.neon .tag{display:inline-block;padding:4px 12px;border-radius:999px;font-size:12px;
  background:linear-gradient(90deg,#a78bfa,#f472b6);font-weight:600;color:#0a0a0a;}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body class="bg-neutral-950 text-white min-h-screen flex items-center justify-center p-8">
<div class="neon max-w-md">
  <span class="tag">NEW</span>
  <h3 class="text-2xl font-extrabold mt-4 mb-2">霓虹渐变卡片</h3>
  <p class="text-neutral-300 text-sm">悬停时霓虹光晕增强并上浮，适合特性展示。</p>
</div>
<script></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>彩虹渐变按钮</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}

.rainbow-btn{padding:14px 32px;border-radius:999px;font-weight:700;color:#fff;border:none;cursor:pointer;
  background:linear-gradient(90deg,#f472b6,#a78bfa,#60a5fa,#34d399,#f472b6);background-size:300% 100%;
  animation:rainbow 4s linear infinite;box-shadow:0 8px 24px rgba(167,139,250,.4);transition:transform .2s;}
.rainbow-btn:hover{transform:scale(1.05);}
@keyframes rainbow{0%{background-position:0% 50%}100%{background-position:300% 50%}}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body class="bg-neutral-950 text-white min-h-screen flex flex-wrap items-center justify-center gap-6 p-8">
<button class="rainbow-btn">🌈 立即体验</button>
<script></script>
</body>
</html>

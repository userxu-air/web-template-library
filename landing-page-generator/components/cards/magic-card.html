<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>魔法卡片 · 鼠标跟随聚光</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}

.magic-card{position:relative;border-radius:16px;padding:2px;overflow:hidden;
  background:radial-gradient(220px circle at var(--mx,-100px) var(--my,-100px),#a78bfa,#f472b6,transparent 70%);}
.magic-card::before{content:'';position:absolute;inset:1px;border-radius:15px;background:#171717;z-index:1;}
.magic-card .inner{position:relative;z-index:2;border-radius:15px;padding:32px;background:#171717;}
.glow{position:absolute;inset:1px;border-radius:15px;z-index:1;opacity:0;transition:opacity .3s;
  background:radial-gradient(220px circle at var(--mx,-100px) var(--my,-100px),rgba(167,139,250,.25),transparent 70%);}
.magic-card:hover .glow{opacity:1;}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body class="bg-neutral-950 text-white min-h-screen flex items-center justify-center p-8">
<div class="grid gap-6 md:grid-cols-2">
  <div class="magic-card" id="card1">
    <div class="glow"></div>
    <div class="inner">
      <div class="text-3xl mb-3">✨</div>
      <h3 class="text-xl font-bold mb-2">智能聚光</h3>
      <p class="text-neutral-400 text-sm">移动鼠标，卡片边框会跟随你的光标流动彩色光晕。</p>
    </div>
  </div>
  <div class="magic-card" id="card2">
    <div class="glow"></div>
    <div class="inner">
      <div class="text-3xl mb-3">🚀</div>
      <h3 class="text-xl font-bold mb-2">极致流畅</h3>
      <p class="text-neutral-400 text-sm">基于 CSS 变量与原生 JS，零依赖实现顺滑交互。</p>
    </div>
  </div>
</div>
<script>
document.querySelectorAll('.magic-card').forEach(card=>{
  card.addEventListener('mousemove',e=>{
    const r=card.getBoundingClientRect();
    card.style.setProperty('--mx',(e.clientX-r.left)+'px');
    card.style.setProperty('--my',(e.clientY-r.top)+'px');
  });
  card.addEventListener('mouseleave',()=>{
    card.style.setProperty('--mx','-100px');
    card.style.setProperty('--my','-100px');
  });
});
</script>
</body>
</html>

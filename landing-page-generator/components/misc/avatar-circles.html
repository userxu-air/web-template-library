<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>头像堆叠</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}

.avatars{display:flex;}
.avatar{width:48px;height:48px;border-radius:50%;border:3px solid #0a0a0a;margin-left:-12px;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;transition:transform .2s;}
.avatar:hover{transform:translateY(-4px);}
.avatar:first-child{margin-left:0;}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body class="bg-neutral-950 text-white min-h-screen flex items-center justify-center p-8">
<div class="text-center">
  <div class="avatars justify-center">
    <div class="avatar" style="background:linear-gradient(135deg,#f472b6,#a78bfa)">A</div>
    <div class="avatar" style="background:linear-gradient(135deg,#60a5fa,#34d399)">B</div>
    <div class="avatar" style="background:linear-gradient(135deg,#fbbf24,#f87171)">C</div>
    <div class="avatar" style="background:linear-gradient(135deg,#a78bfa,#60a5fa)">D</div>
    <div class="avatar" style="background:#333">+9</div>
  </div>
  <p class="mt-4 text-neutral-400">已有 1000+ 用户加入</p>
</div>
<script></script>
</body>
</html>

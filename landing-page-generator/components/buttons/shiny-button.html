<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>闪亮按钮</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}

.shiny-btn{position:relative;padding:14px 32px;border-radius:12px;font-weight:600;border:none;cursor:pointer;
  background:#171717;color:#fff;border:1px solid #333;}
.shiny-btn span{position:relative;z-index:1;}
.shiny-btn::before{content:'';position:absolute;inset:0;border-radius:12px;background:radial-gradient(circle at var(--x,50%) var(--y,50%),#a78bfa,transparent 60%);
  opacity:0;transition:opacity .3s;}
.shiny-btn:hover::before{opacity:.35;}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body class="bg-neutral-950 text-white min-h-screen flex flex-wrap items-center justify-center gap-6 p-8">
<button class="shiny-btn" id="shiny"><span>鼠标悬停看效果</span></button>
<script>
const b=document.getElementById('shiny');
b.addEventListener('mousemove',e=>{const r=b.getBoundingClientRect();
  b.style.setProperty('--x',(e.clientX-r.left)+'px');b.style.setProperty('--y',(e.clientY-r.top)+'px');});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>打字机效果</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}

.typing{font-family:'Space Grotesk',monospace;border-right:3px solid #a78bfa;padding-right:8px;
  animation:caret .8s step-end infinite;}
@keyframes caret{50%{border-color:transparent}}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body class="bg-neutral-950 text-white min-h-screen flex items-center justify-center p-8">
<div class="text-center">
  <h1 class="text-5xl md:text-7xl font-extrabold tracking-tight"><span class="typing" id="typing"></span></h1>
  <p class="mt-6 text-neutral-400 text-lg">逐字打印，营造手写般的亲切感。</p>
</div>
<script>
const text="让每一个字，都有节奏地出现。";
const el=document.getElementById('typing');let i=0;
function type(){if(i<=text.length){el.textContent=text.slice(0,i);i++;setTimeout(type,80);}}
type();
</script>
</body>
</html>

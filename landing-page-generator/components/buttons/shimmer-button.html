<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>流光按钮</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}

.shimmer-btn{position:relative;overflow:hidden;padding:14px 32px;border-radius:999px;font-weight:600;
  background:#a78bfa;color:#0a0a0a;border:none;cursor:pointer;}
.shimmer-btn::after{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);animation:shine 2.5s infinite;}
@keyframes shine{0%{left:-100%}100%{left:100%}}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body class="bg-neutral-950 text-white min-h-screen flex flex-wrap items-center justify-center gap-6 p-8">
<button class="shimmer-btn">立即开始</button>
<button class="shimmer-btn" style="background:#0f172a;color:#fff;border:1px solid #334155">了解更多</button>
<script></script>
</body>
</html>
